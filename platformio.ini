[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    madhephaestus/ESP32Servo@^1.1.1

test_ignore = *

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
build_src_filter = -<*>
test_framework = unity
